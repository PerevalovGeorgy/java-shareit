version: '3.8'

services:
  postgres:
    image: postgres:15-alpine # или ваша версия
    container_name: postgres_shareit
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: